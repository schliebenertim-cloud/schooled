<style>

:root[data-theme="dark"]{--bg:#121b17;--bg2:#17231e;--fg:#eef1ea;--card:#1c2a24;--line:#33473d;--accent:#2f7a61;--accent2:#f0c35a;--onacc:#f4fbf6;--bad:#ff8f84;--good:#7ddc9b;--muted:#9bab9f;--wood:#8f6636;--wood2:#6b4a25;--shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:radial-gradient(circle at 20% 0,var(--bg2),transparent 60%),var(--bg)}
header{background:linear-gradient(135deg,var(--accent),#1a4536);color:var(--onacc);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 0 var(--wood),0 8px 18px rgba(0,0,0,.2);position:relative}
header h1{margin:0;font:400 32px/1 "Segoe Print","Chalkboard SE","Bradley Hand","Comic Sans MS",cursive;letter-spacing:1px;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
main{max-width:1100px;margin:0 auto;padding:22px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center;max-width:480px;margin:40px auto;padding:28px}
.center h2{font:400 28px "Segoe Print","Chalkboard SE","Comic Sans MS",cursive;margin:0 0 8px;color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--accent);color:var(--onacc);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s,filter .15s,box-shadow .08s}

input,select,textarea{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.wb{width:100%;height:auto;aspect-ratio:10/6;border-radius:6px;border:7px solid var(--wood);outline:2px solid var(--wood2);background:#fff;display:block;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 4px 10px rgba(0,0,0,.2);margin-top:8px}
.own{cursor:crosshair}
.tm{font:800 30px/1 ui-monospace,"SF Mono",Menlo,monospace;background:var(--accent);color:var(--onacc);padding:8px 16px;border-radius:12px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.q{font:400 24px/1.3 "Segoe Print","Chalkboard SE","Comic Sans MS",cursive;color:var(--accent)}
.badge{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.ok{color:var(--good);border-color:var(--good)}.no{color:var(--bad);border-color:var(--bad)}
.muted{color:var(--muted);font-size:14px}
.out{opacity:.5;filter:grayscale(.8)}
.banner{background:linear-gradient(135deg,var(--accent2),#d4962a);color:#2b2108;border-radius:16px;padding:16px;text-align:center;font-weight:800;font-size:24px;margin-bottom:14px;box-shadow:var(--shadow)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);outline:2px solid var(--line);padding:0}
.hide{display:none!important}
body{background:linear-gradient(rgba(127,127,127,.1) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,rgba(127,127,127,.1) 1px,transparent 1px) 0 0/26px 26px,radial-gradient(circle at 20% 0,var(--bg2),transparent 60%),var(--bg)}
.card,.banner{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.grid .card{transition:transform .2s}.grid .card:hover{transform:translateY(-3px)}
.chalk{background:linear-gradient(160deg,#2c6b55,#1b4a3a);border:8px solid var(--wood);outline:2px solid var(--wood2);border-radius:10px;color:#f7f9f2;box-shadow:inset 0 0 40px rgba(0,0,0,.35),var(--shadow);padding:20px}
.chalk .q{color:#f7f9f2;font-size:28px}
.chalk .tm{background:#f7f9f2;color:#1b4a3a}
.chalk textarea{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#f7f9f2;font:20px "Segoe Print","Chalkboard SE","Comic Sans MS",cursive}
.chalk textarea::placeholder{color:rgba(247,249,242,.6)}
.chalk select{background:#fffdf8;color:#222}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25);flex:none}
.tm.warn{animation:pulse .6s infinite alternate;background:var(--bad);color:#fff}
@keyframes pulse{to{transform:scale(1.1)}}
.conf{position:fixed;top:-30px;font-size:26px;z-index:98;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#pres{position:fixed;inset:0;z-index:90;overflow:auto;padding:calc(26px + env(safe-area-inset-top,0px)) 28px calc(26px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 0,#2f7a61,#143528 70%);color:#f7f9f2;display:flex;flex-direction:column;align-items:center;gap:18px}
#pres .pm{font:400 20px "Segoe Print","Chalkboard SE","Comic Sans MS",cursive;opacity:.8;letter-spacing:1px}
#pres .pq{font:400 clamp(28px,5vw,64px)/1.25 "Segoe Print","Chalkboard SE","Comic Sans MS",cursive;text-align:center;max-width:1100px;text-shadow:0 0 2px rgba(255,255,255,.6)}
#pres .pt{font-size:clamp(40px,8vw,110px);padding:10px 36px;background:#f7f9f2;color:#1b4a3a}
#pres .pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;width:100%;max-width:1400px}
#pres .pc{margin:0}
#pres .banner{width:100%;max-width:900px;font-size:clamp(26px,4vw,48px)}
.pwait{height:140px;display:flex;align-items:center;justify-content:center;font:400 28px "Segoe Print","Chalkboard SE","Comic Sans MS",cursive;color:var(--muted)}
.pex{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:14px;opacity:.5}.pex:hover{opacity:1}
@media (max-width:560px){header h1{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Schooled</h1><span class="row"><span id="who" class="muted" style="color:inherit"></span><button id="home" class="alt hide" style="color:inherit;border-color:currentColor">⌂ Home</button></span></header>
<main id="app"></main>
<script>
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c));return e};
const app=document.getElementById('app'),W=1000,H=600;
let db,uid,isOwner=false,game={phase:'lobby',round:0},players={},role=null,V={},drawing=false,lastLock=null;
const msg=t=>{role=null;app.replaceChildren($('div',{class:'card center'},t))};
const names=()=>Object.entries(players).sort((a,b)=>(a[1].joined||0)-(b[1].joined||0));
const locked=()=>game.phase!=='question'||(game.timerEnd>0&&now()>=game.timerEnd);
function draw(cv,strokes){const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,H);c.lineCap='round';c.lineJoin='round';for(const s of strokes||[]){const p=s.p;if(!p||p.length<2)continue;c.strokeStyle=s.c;c.lineWidth=s.w;c.beginPath();c.moveTo(p[0],p[1]);if(p.length===2)c.lineTo(p[0]+.1,p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.stroke()}}
const thumb=s=>{const cv=$('canvas',{width:W,height:H,class:'wb'});draw(cv,s);return cv};
const lives=p=>{const g=Math.min(p.grade6||0,3);return 'Note 6  '+'✖'.repeat(g)+'○'.repeat(3-g)};


let owner={},spectator=false,pres=null,host=false,peer=null,conn=null,conns=[],S=null,roomCode='',skew=0,ready=false,rj=0,bt=0;
const now=()=>Date.now()+skew;
const saved=()=>{try{return JSON.parse(sessionStorage.getItem('schooled-room'))}catch(e){return null}};
const saveRoom=o=>{try{sessionStorage.setItem('schooled-room',JSON.stringify(o))}catch(e){}};
const newCode=()=>Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');
function leave(){try{sessionStorage.removeItem('schooled-room')}catch(e){}location.reload()}
function fail(t){role=null;app.replaceChildren($('div',{class:'card center'},$('p',{},t),$('div',{class:'row',style:'justify-content:center'},$('button',{onclick:()=>location.reload()},'Neu laden'),$('button',{class:'alt',onclick:leave},'Zurück zum Start'))))}
function changed(){
  game=S.game;players=S.players;route();
  if(host&&!bt)bt=setTimeout(()=>{bt=0;const m={t:'state',S,now:Date.now()};conns.forEach(c=>{if(c.open)c.send(m)});try{sessionStorage.setItem('schooled-state-'+roomCode,JSON.stringify(S))}catch(e){}},80);
}
function applyOp(p,k,d,from){
  if(p==='game/state'){S.game=k==='set'?d:{...S.game,...d}}
  else{
    const id=p.split('/')[1];
    if(k==='join'){const o=owner[id];if(from&&o&&o!==from&&o.open){from.send({t:'dup'});return}if(from)owner[id]=from;if(!S.players[id]){if(Object.keys(S.players).length>=6){if(from&&from.open)from.send({t:'full'});return}S.players[id]={name:d.name,strokes:[],grade6:0,out:false,cheats:2,peek:'',gradedRound:0,result:'',joined:Date.now()}}}
    else if(k==='set')S.players[id]=d;
    else if(k==='update'){if(S.players[id])Object.assign(S.players[id],d)}
    else delete S.players[id];
  }
  changed();
}
function op(p,k,d){if(host)applyOp(p,k,d);else if(conn&&conn.open)conn.send({t:'op',p,k,d});return Promise.resolve()}
const W_=p=>({set:d=>op(p,'set',d),update:d=>op(p,'update',d),delete:()=>op(p,'delete')});
const gameRef=()=>W_('game/state'),pRef=id=>W_('players/'+id);

function startHost(code,fresh){
  host=true;roomCode=code;msg('Raum wird erstellt …');
  peer=new Peer('schooled-'+code);
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      if(fresh){const c=newCode();saveRoom({code:c,host:true});peer.destroy();startHost(c,true)}
      else setTimeout(()=>{peer.destroy();startHost(code,false)},3000)
    }else fail('Verbindungsfehler ('+e.type+'). Bitte Internetverbindung prüfen.');
  });
  peer.on('open',()=>{
    try{S=JSON.parse(sessionStorage.getItem('schooled-state-'+code))}catch(e){S=null}
    if(!S||!S.game)S={game:{phase:'lobby',round:0,q:'',timerEnd:0},players:{}};
    S.game.master=uid;ready=true;changed();
  });
  peer.on('connection',c=>{
    conns.push(c);
    c.on('open',()=>c.send({t:'state',S,now:Date.now()}));
    c.on('data',m=>{if(m&&m.t==='op')applyOp(m.p,m.k,m.d,c)});
    c.on('close',()=>{conns=conns.filter(x=>x!==c)});
  });
}
function startClient(code,name){
  roomCode=code;spectator=!name;msg('Verbinde mit Raum '+code+' …');
  peer=new Peer();
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Raum '+code+' nicht gefunden. Prüfe den Code – der Quizmaster muss den Raum geöffnet haben.':'Verbindungsfehler ('+e.type+').'));
  peer.on('open',()=>{
    conn=peer.connect('schooled-'+code,{reliable:true,serialization:'json'});
    conn.on('open',()=>{if(name)conn.send({t:'op',p:'players/'+uid,k:'join',d:{name}})});
    conn.on('data',m=>{
      if(m.t==='state'){S=m.S;skew=m.now-Date.now();ready=true;changed()}
      else if(m.t==='dup'){uid=Math.random().toString(36).slice(2,12);try{sessionStorage.setItem('schooled-uid',uid)}catch(e){}conn.send({t:'op',p:'players/'+uid,k:'join',d:{name}})}
      else if(m.t==='full'){alert_('Der Raum ist voll (6 Schüler).');setTimeout(leave,2500)}
    });
    conn.on('close',()=>fail('Die Verbindung zum Quizmaster ist abgebrochen.'));
  });
  setTimeout(()=>{if(!ready)fail('Keine Antwort vom Raum '+code+'. Ist der Quizmaster online?')},12000);
}
function alert_(t){note(t)}
function showPres(onExit){
  if(pres)return;
  const tm=$('div',{class:'tm pt'}),q=$('div',{class:'pq'}),meta=$('div',{class:'pm'}),grid=$('div',{class:'pg'}),ban=$('div',{class:'banner hide'});
  const ex=$('button',{class:'alt pex',onclick:hidePres},onExit?'✕ Verlassen':'✕ Beenden');
  const el=$('div',{id:'pres'},ex,meta,q,tm,ban,grid);
  document.body.append(el);
  pres={el,tm,q,meta,grid,ban,onExit};
  try{if(el.requestFullscreen)el.requestFullscreen().catch(()=>{})}catch(e){}
  updPres();
}
function hidePres(){
  if(!pres)return;const f=pres.onExit;pres.el.remove();pres=null;
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  if(f)f();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pres&&!pres.onExit)hidePres()});
function updPres(){
  if(!pres)return;
  pres.q.textContent=game.phase==='lobby'?'Warte auf Mitspieler …':(game.q||'');
  pres.meta.textContent='Schooled · Raum '+roomCode+(game.round?' · Runde '+game.round:'');
  winner(pres.ban);
  const rev=game.phase==='revealed';
  pres.grid.replaceChildren(...names().map(([id,p])=>{
    const g=p.gradedRound===game.round&&game.round>0;
    return $('div',{class:'card pc'+(p.out?' out':'')},
      $('div',{class:'row',style:'justify-content:space-between'},$('span',{class:'row'},av(p.name,id),$('b',{style:'font-size:22px'},p.name)),g?$('span',{class:'badge '+(p.result==='ok'?'ok':'no')},p.result==='ok'?'✓ Richtig':'Note 6'):''),
      $('div',{class:'muted'},lives(p)),
      rev?thumb(p.strokes):$('div',{class:'pwait'},p.out?'raus':game.phase==='question'?(p.strokes&&p.strokes.length?'✍️ schreibt …':'💭 denkt nach …'):'bereit'));
  }));
  tick();
}
function entry(){
  setTimeout(()=>{const v=$('p',{class:'muted',style:'text-align:center'},'Version 5 · Mehrspieler per PeerJS');app.append(v)},0);
  const code=$('input',{placeholder:'Raumcode, z. B. KXMT',maxlength:'4',style:'text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:4px'}),nm=$('input',{placeholder:'Dein Name',maxlength:'20'});
  app.replaceChildren(
    $('div',{class:'card center',style:'margin-bottom:0'},$('h2',{},'Ich bin Quizmaster'),$('p',{class:'muted'},'Erstelle einen Raum und gib den Code an deine Schüler weiter.'),$('button',{onclick:()=>{const c=newCode();saveRoom({code:c,host:true});startHost(c,true)}},'Raum erstellen')),
    $('div',{class:'card center'},$('h2',{},'Ich bin Schüler'),code,$('div',{style:'height:8px'}),nm,$('div',{style:'height:10px'}),$('button',{onclick:()=>{const c=code.value.trim().toUpperCase(),n=nm.value.trim();if(c.length!==4||!n)return note('Bitte Code (4 Zeichen) und Namen eingeben.');saveRoom({code:c,host:false,name:n});startClient(c,n)}},'Beitreten')),
    (()=>{const bc=$('input',{placeholder:'Raumcode',maxlength:'4',style:'text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:4px'});return $('div',{class:'card center',style:'margin-top:0'},$('h2',{},'Beamer / Tafel'),$('p',{class:'muted'},'Zeigt die Show groß an, ohne mitzuspielen.'),bc,$('div',{style:'height:10px'}),$('button',{onclick:()=>{const c=bc.value.trim().toUpperCase();if(c.length!==4)return note('Bitte den 4-stelligen Code eingeben.');saveRoom({code:c,host:false,spectator:true});startClient(c,null)}},'Anzeige starten'))})());
}
function init(){
  try{uid=sessionStorage.getItem('schooled-uid');if(!uid){uid=Math.random().toString(36).slice(2,12);sessionStorage.setItem('schooled-uid',uid)}}catch(e){uid=Math.random().toString(36).slice(2,12)}
  setInterval(tick,250);
  if(typeof Peer==='undefined'){fail('PeerJS konnte nicht geladen werden. Internetverbindung prüfen.');return}
  const sv=saved();
  if(sv&&sv.host)startHost(sv.code,false);else if(sv&&sv.spectator)startClient(sv.code,null);else if(sv&&sv.name)startClient(sv.code,sv.name);else entry();
}

function route(){
  if(drawing)return;
  if(spectator){role='p';if(!pres)showPres(leave);updPres();return}
  const r=host?'m':players[uid]?'s':'j';
  if(players[uid])rj=0;
  if(r==='j'){const sv=saved();if(!host&&sv&&sv.name&&!rj){rj=1;op('players/'+uid,'join',{name:sv.name})}return}
  if(r!==role||(r==='j'&&!V.join)){role=r;V={};r==='m'?buildMaster():r==='s'?buildStudent():buildJoin()}
  if(r==='m')updMaster();else if(r==='s')updStudent();else updJoin();
  document.getElementById('who').textContent=r==='m'?'Quizmaster · Code '+roomCode:r==='s'?players[uid].name+' · Code '+roomCode:'';
  document.getElementById('home').classList.toggle('hide',r==='j');
}
async function goHome(){
  if(!await ask(role==='m'?'Zurück zum Start? Der Raum wird beendet.':'Zurück zum Start? Du verlässt das Spiel und deine Noten gehen verloren.'))return;
  if(role==='s')await pRef(uid).delete();
  try{sessionStorage.removeItem('schooled-state-'+roomCode)}catch(e){}
  setTimeout(leave,150);
}

/* ---------- Beitreten ---------- */
function buildJoin(){
  V.join=1;V.name=$('input',{placeholder:'Dein Name',maxlength:'20'});
  V.bS=$('button',{onclick:async()=>{const n=V.name.value.trim();if(!n)return note('Bitte Namen eingeben.');if(names().length>=6)return note('Schon 6 Schüler – das Klassenzimmer ist voll.');await pRef(uid).set({name:n,strokes:[],grade6:0,out:false,cheats:2,peek:'',gradedRound:0,result:'',joined:Date.now()})}},'Als Schüler beitreten');
  V.bM=$('button',{class:'alt',onclick:async()=>{await gameRef().set({master:uid,phase:'lobby',round:0,q:'',timerEnd:0})}},'Quizmaster werden');
  V.info=$('p',{class:'muted'});
  app.replaceChildren($('div',{class:'card center'},$('h2',{},'Willkommen bei Schooled'),$('p',{class:'muted'},'Quizmaster stellt die Frage, bis zu 6 Schüler schreiben ihre Antwort aufs Whiteboard.'),V.name,$('div',{class:'row',style:'justify-content:center;margin-top:10px'},V.bS,V.bM),V.info));
}
function updJoin(){
  const n=names().length;V.bS.disabled=n>=6;
  const canM=!game.master||isOwner;V.bM.disabled=!canM;
  V.info.textContent=(n?n+' von 6 Schülern im Raum: '+names().map(x=>x[1].name).join(', ')+'. ':'')+(game.master?'Ein Quizmaster ist schon da.':'Noch kein Quizmaster.');
}

/* ---------- Quizmaster ---------- */
function buildMaster(){
  V.q=$('textarea',{rows:'2',placeholder:'Frage eingeben …'});
  V.dur=$('select',{},[['0','Kein Timer'],['30','30 s'],['60','60 s'],['90','90 s'],['120','2 min'],['180','3 min']].map(([v,t])=>$('option',{value:v},t)));V.dur.value='60';
  V.start=$('button',{onclick:startRound},'▶ Frage starten');
  V.stop=$('button',{class:'alt',onclick:()=>gameRef().update({timerEnd:Date.now()})},'⏹ Timer stoppen');
  V.rev=$('button',{onclick:()=>gameRef().update({phase:'revealed'})},'👁 Aufdecken');
  V.reset=$('button',{class:'alt',onclick:resetGame},'Neues Spiel');V.pbtn=$('button',{class:'alt',onclick:()=>showPres()},'📺 Präsentation');
  V.banner=$('div',{class:'banner hide'});V.tm=$('span',{class:'tm'});V.st=$('span',{class:'muted'});V.boards=$('div',{class:'grid'});
  app.replaceChildren(V.banner,$('div',{class:'card chalk'},V.q,$('div',{class:'row',style:'margin-top:8px'},V.dur,V.start,V.stop,V.rev,V.pbtn,V.reset)),$('div',{class:'card row'},V.tm,V.st),V.boards);
}
async function startRound(){
  const q=V.q.value.trim();if(!q)return note('Bitte erst eine Frage eingeben.');
  const d=+V.dur.value;
  await Promise.all(Object.keys(players).map(id=>pRef(id).update({strokes:[],peek:'',result:''})));
  await gameRef().set({master:uid,q,phase:'question',round:(game.round||0)+1,timerEnd:d?Date.now()+d*1000:0,dur:d});
}
async function resetGame(){
  if(!await ask('Neues Spiel? Alle Schüler und Noten werden entfernt.'))return;
  await Promise.all(Object.keys(players).map(id=>pRef(id).delete()));
  await gameRef().set({master:uid,phase:'lobby',round:0,q:'',timerEnd:0});
}
async function grade(id,ok){const p=players[id],g=ok?p.grade6:p.grade6+1;await pRef(id).update({grade6:g,out:g>=3,result:ok?'ok':'6',gradedRound:game.round})}
function updMaster(){
  V.stop.disabled=!(game.phase==='question'&&!locked());V.rev.disabled=game.phase!=='question';
  V.st.textContent=game.phase==='lobby'?'Warte auf Schüler … ('+names().length+'/6)':'Runde '+game.round+' · '+(game.phase==='question'?'Frage läuft':'Aufgedeckt')+(game.q?' · „'+game.q+'“':'');
  winner(V.banner);updPres();
  V.boards.replaceChildren(...names().map(([id,p])=>{
    const cheat=game.phase==='question'&&p.peek&&players[p.peek]?'👀 schaut bei '+players[p.peek].name:'';
    const graded=p.gradedRound===game.round&&game.round>0;
    return $('div',{class:'card'+(p.out?' out':'')},
      $('div',{class:'row',style:'justify-content:space-between'},$('span',{class:'row'},av(p.name,id),$('b',{},p.name+(p.out?' (raus)':''))),$('span',{class:'badge'},lives(p))),
      $('div',{class:'muted'},'Schummler übrig: '+p.cheats+(cheat?' · '+cheat:'')),
      thumb(p.strokes),
      $('div',{class:'row',style:'margin-top:8px'},
        $('button',{class:'good',disabled:p.out||graded,onclick:()=>grade(id,true)},'✓ Richtig'),
        $('button',{class:'bad',disabled:p.out||graded,onclick:()=>grade(id,false)},'Note 6'),
        graded?$('span',{class:'badge '+(p.result==='ok'?'ok':'no')},p.result==='ok'?'Richtig':'Note 6'):''));
  }));
  tick();
}
function winner(el){
  const all=names(),act=all.filter(x=>!x[1].out);
  if(all.length>=2&&act.length===1){el.textContent='🏆 '+act[0][1].name+' gewinnt!';el.classList.remove('hide');if(el.dataset.w!==act[0][0]){el.dataset.w=act[0][0];confetti()}}
  else if(all.length>=2&&!act.length){el.textContent='Alle sind raus – Unentschieden!';el.classList.remove('hide')}
  else el.classList.add('hide');
}

/* ---------- Schüler ---------- */
function buildStudent(){
  const me=players[uid];
  V.local=(me.strokes||[]).map(s=>({...s}));V.round=game.round;V.tool={c:'#111111',w:4};
  V.hdr=$('div',{class:'row',style:'justify-content:space-between'});
  V.q=$('div',{class:'q'});V.tm=$('span',{class:'tm'});V.res=$('span');
  V.cv=$('canvas',{width:W,height:H,class:'wb own'});draw(V.cv,V.local);
  const pt=e=>{const r=V.cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*W/r.width),Math.round((e.clientY-r.top)*H/r.height)]};
  let cur=null,tm=null;
  const save=()=>{clearTimeout(tm);tm=null;pRef(uid).update({strokes:V.local}).catch(()=>{})};
  V.save=save;
  V.cv.addEventListener('pointerdown',e=>{if(locked()||players[uid].out)return;V.cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cur={c:V.tool.c,w:V.tool.w,p:[x,y]};V.local.push(cur);drawing=true;draw(V.cv,V.local)});
  V.cv.addEventListener('pointermove',e=>{if(!cur)return;const[x,y]=pt(e),p=cur.p;if(Math.hypot(x-p[p.length-2],y-p[p.length-1])<3)return;p.push(x,y);draw(V.cv,V.local);if(!tm)tm=setTimeout(save,400)});
  const end=()=>{if(!cur)return;cur=null;drawing=false;save();route()};
  V.cv.addEventListener('pointerup',end);V.cv.addEventListener('pointercancel',end);
  const sw=(c,w,l)=>$('button',{class:'sw',style:'background:'+c,title:l,onclick:()=>{V.tool={c,w}}});
  V.tools=$('div',{class:'row',style:'margin-top:8px'},sw('#111111',4,'Schwarz'),sw('#1565c0',4,'Blau'),sw('#d32f2f',4,'Rot'),
    $('button',{class:'alt',onclick:()=>{V.tool={c:'#ffffff',w:28}}},'Radierer'),
    $('button',{class:'alt',onclick:()=>{if(locked())return;V.local.pop();draw(V.cv,V.local);save()}},'↶ Rückgängig'),
    $('button',{class:'alt',onclick:()=>{if(locked())return;V.local=[];draw(V.cv,V.local);save()}},'Alles löschen'));
  V.own=$('div',{class:'card'},$('b',{},'Dein Whiteboard'),V.cv,V.tools);
  V.cheatBtn=$('button',{class:'alt',onclick:()=>{V.pick.classList.toggle('hide')}},'🕵 Schummeln');
  V.pick=$('div',{class:'row hide',style:'margin-top:8px'});
  V.peek=$('div',{class:'card hide'});
  V.cheat=$('div',{class:'card'},V.cheatBtn,V.pick);
  V.banner=$('div',{class:'banner hide'});V.out=$('div',{class:'card no hide'},'Du bist raus – drei Mal Note 6. Du schaust jetzt zu.');
  V.all=$('div',{class:'grid'});
  app.replaceChildren(V.banner,V.hdr,$('div',{class:'card chalk'},V.q,$('div',{class:'row',style:'margin-top:10px'},V.tm,V.res)),V.out,V.own,V.cheat,V.peek,V.all);
}
function updStudent(){
  const me=players[uid];
  if(V.round!==game.round){V.round=game.round;V.local=[];draw(V.cv,V.local);V.pick.classList.add('hide')}
  V.hdr.replaceChildren($('span',{class:'badge'},lives(me)),$('span',{class:'badge'},'Schummler: '+me.cheats));
  V.q.textContent=game.phase==='lobby'?'Warte auf den Quizmaster …':(game.q||'');
  const g=me.gradedRound===game.round&&game.round>0;
  V.res.replaceChildren(g?$('span',{class:'badge '+(me.result==='ok'?'ok':'no')},me.result==='ok'?'✓ Richtig':'Note 6'):'');
  V.out.classList.toggle('hide',!me.out);
  const writing=game.phase==='question'&&!me.out;
  V.own.classList.toggle('hide',!writing);
  V.cv.style.opacity=locked()?.6:1;
  const canCheat=writing&&me.cheats>0&&!locked();
  V.cheat.classList.toggle('hide',!writing);V.cheatBtn.disabled=!canCheat;
  V.pick.replaceChildren(...names().filter(([id,p])=>id!==uid&&!p.out).map(([id,p])=>$('button',{onclick:async()=>{if(!await ask('Bei '+p.name+' abschauen? Das kostet einen Schummler.'))return;V.pick.classList.add('hide');await pRef(uid).update({peek:id,cheats:me.cheats-1})}},p.name)));
  const t=me.peek&&players[me.peek];
  V.peek.classList.toggle('hide',!(t&&game.phase==='question'));
  if(t&&game.phase==='question')V.peek.replaceChildren($('b',{},'👀 Du schaust bei '+t.name),thumb(t.strokes));
  winner(V.banner);
  V.all.replaceChildren(...(game.phase==='revealed'?names().map(([id,p])=>$('div',{class:'card'+(p.out?' out':'')},
    $('div',{class:'row',style:'justify-content:space-between'},$('span',{class:'row'},av(p.name,id),$('b',{},p.name+(id===uid?' (du)':''))),p.gradedRound===game.round?$('span',{class:'badge '+(p.result==='ok'?'ok':'no')},p.result==='ok'?'Richtig':'Note 6'):$('span',{class:'badge'},lives(p))),
    thumb(p.strokes))):[]));
  tick();
}

/* ---------- Timer ---------- */
function tick(){
  if(!role||role==='j')return;
  let txt='–';
  if(game.phase==='question'){
    if(game.timerEnd>0){const s=Math.max(0,Math.ceil((game.timerEnd-now())/1000));txt=locked()?'⏰ Zeit um':Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
    else txt='Kein Zeitlimit'}
  else if(game.phase==='revealed')txt='Aufgedeckt';
  const wn=game.phase==='question'&&game.timerEnd>0&&!locked()&&game.timerEnd-now()<10000;for(const t of [V.tm,pres&&pres.tm])if(t){t.textContent=txt;t.classList.toggle('warn',wn)}
  const l=locked();
  if(lastLock!==null&&l!==lastLock&&l){if(role==='s'&&V.save)V.save();route()}
  lastLock=l;
}
function ask(t){return new Promise(r=>{const o=$('div',{style:'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99'});const done=v=>{o.remove();r(v)};o.append($('div',{class:'card',style:'max-width:380px;margin:0'},$('p',{},t),$('div',{class:'row'},$('button',{onclick:()=>done(true)},'Ja'),$('button',{class:'alt',onclick:()=>done(false)},'Abbrechen'))));document.body.append(o)})}
function av(n,id){const h=[...(id||n)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);return $('span',{class:'av',style:'background:hsl('+Math.abs(h)%360+' 55% 42%)'},(n[0]||'?').toUpperCase())}
function confetti(){for(let i=0;i<36;i++){const s=$('span',{class:'conf',style:'left:'+Math.random()*100+'vw;animation-delay:'+Math.random()*1.2+'s'},['🎉','⭐','✨','🏆'][i%4]);document.body.append(s);setTimeout(()=>s.remove(),4600)}}
function note(t){const n=$('div',{class:'card',style:'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:99;margin:0;border-color:var(--bad)'},t);document.body.append(n);setTimeout(()=>n.remove(),3500)}
document.getElementById('home').addEventListener('click',goHome);
init();
</script>
</body>
